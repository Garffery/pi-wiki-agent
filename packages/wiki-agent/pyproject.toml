[project]
name = "pi-wiki-core"
version = "0.1.0"
description = "Wiki management agent — VCS-driven wiki document synchronization"
requires-python = ">=3.11"
dependencies = [
    "pi-agent",
    "pi-coding-agent",
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_wiki_agent"]

[tool.uv.sources]
pi-agent = { workspace = true }
pi-coding-agent = { workspace = true }
