[project]
name = "pi-wiki-desktop"
version = "0.1.0"
description = "Wiki management desktop app — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "pi-wiki-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_wiki_desktop"]

[project.scripts]
pi-wiki-desktop = "pi_wiki_desktop.app:main"

[tool.uv.sources]
pi-wiki-core = { workspace = true }
