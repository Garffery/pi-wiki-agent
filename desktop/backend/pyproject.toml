[project]
name = "pi-desktop-backend"
version = "0.1.0"
description = "FastAPI backend for Pi Desktop app"
requires-python = ">=3.11"
dependencies = [
    "pi-coding-agent",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_desktop_backend"]

[tool.uv.sources]
pi-coding-agent = { workspace = true }
