appId: com.pi-wiki-agent.app
productName: Wiki 管理
copyright: Copyright © 2024

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

directories:
  output: dist

extraResources:
  - from: build/dist/backend
    to: backend

win:
  sign: null
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Wiki 管理

files:
  - main.js
  - preload.js
  - package.json
