[project]
name = "pi-wiki-agent"
version = "0.53.0"
description = "Wiki management agent — sync wiki docs based on VCS commit changes"
requires-python = ">=3.11,<3.14"

[dependency-groups]
dev = [
    "debugpy>=1.8.21",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
]

[tool.uv.workspace]
members = ["packages/ai", "packages/agent", "packages/coding-agent", "packages/tui", "packages/wiki-agent", "desktop"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["packages/wiki-agent/src"]
testpaths = [
    "packages/ai/tests",
    "packages/agent/tests",
    "packages/coding-agent/tests",
    "packages/tui/tests",
    "packages/wiki-agent/tests",
    "desktop/tests",
]
